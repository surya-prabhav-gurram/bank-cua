[project]
name = "bank-cua"
version = "0.1.0"
description = "Record-once / replay-many computer-use automation for legacy back-office apps"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Build output, not source: it is regenerated by `cli codegen` from an artifact
# and is committed only as an example of the code-generation stretch goal.
exclude = ["generated"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "SIM", "RUF", "ARG"]
ignore = [
    # try/except/pass is used deliberately for best-effort evidence capture and
    # perception: a screenshot that fails must never break the run it documents.
    # The explicit form states that intent more plainly than contextlib.suppress.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# The evidence generator bootstraps sys.path so it runs from a clean clone
# without installation; those imports cannot precede it.
"scripts/gen_evidence.py" = ["E402"]
# Integration tests call pytest.importorskip("playwright") before importing the
# modules that need it, so they skip cleanly rather than erroring on collection.
"tests/*" = ["E402", "ARG001", "ARG002", "ARG005", "SIM115"]
# The run log's file handle is deliberately long-lived and flushed per event: a
# run's log has to survive the run crashing, so events must already be on disk
# when it does. It is closed in finish().
"bankcua/observability/logging.py" = ["SIM115"]
# These modules embed an HTML/JS template as a module-level string. The
# line-length rule exists to keep PYTHON readable; wrapping markup and script
# lines to satisfy it makes the template harder to read, not easier, and
# introduces whitespace bugs in <pre> content. RUF001 fires on a multiplication
# sign used as display text.
"bankcua/dashboard.py" = ["E501", "RUF001"]
"bankcua/chat/app.py" = ["E501"]
"bankcua/escalation/console.py" = ["E501"]
