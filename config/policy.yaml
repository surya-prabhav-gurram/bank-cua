# Global safety policy (guardrails). Enforced on every action in both
# discovery and replay. A run may narrow this further via the artifact's own
# target.allowed_url_patterns (a URL must satisfy BOTH).

# Allowlist of URL substrings / glob patterns the agent may touch.
# Keep this tight. Anything not matching is blocked (fail closed).
allowed_url_patterns:
  - "http://127.0.0.1:*"
  - "http://localhost:*"

# Explicit denylist (checked first, wins over the allowlist).
blocked_url_patterns:
  - "*/logout*"          # example: never let automation sign the operator out
  - "*/_control/*"       # test-only control plane is off limits to the agent

# Action types the agent may perform at all.
allowed_action_types:
  - navigate
  - click
  - fill
  - select_option
  - press_key
  - wait_for
  - extract
  - assert_checkpoint

# Irreversible ("risky") steps are blocked unless a run is explicitly approved
# with --allow-risky. Steps flagged requires_confirmation are instead gated
# behind a human confirmation (an escalation when unattended).
allow_risky: false
require_confirmation_for_risky: true

# ---------------------------------------------------------------------------
# Value-level (semantic) policy. The allowlist above is URL/action-shaped: it can
# answer "may the agent click here" but not "is this amount sane". These rules
# inspect the INPUTS a capability is invoked with, before the browser opens.
#
#   max                -> hard ceiling. Refused outright, never escalated: no
#                         operator at a browser should be able to wave through an
#                         amount the institution has already ruled out.
#   dual_control_above -> permitted, but not by one person alone. Requires an
#                         independent second approver (--approver), or an
#                         operator counter-signature. Unattended, it fails closed.
#
# Keyed by input parameter name, so a capability declaring `deposit` inherits
# these without knowing they exist.
#   max_per_window     -> bounds the SUM over a rolling window. A per-invocation
#                         ceiling is blind to velocity: ten $999 deposits inside a
#                         minute clear a $1,000 limit ten times over.
value_rules:
  deposit:
    max: 10000.00
    dual_control_above: 1000.00
    max_per_window: 5000.00
    window_seconds: 3600
    unit: " USD"

# Identities permitted to counter-sign a dual-control run. Without a registry,
# `--approver whoever` is theatre: any typed string counts as a second pair of
# eyes. This stands in for the institution's directory -- binding it to real
# authenticated identity changes where the set comes from, not the check.
approvers:
  - bruce
  - dana
# Refuse to accept an unregistered approver even when the registry is empty.
strict_approvers: true
