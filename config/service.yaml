# Server-side authorisation for the capability API.
#
# Everything here was previously decided by the CALLER, in the request body. That
# meant whoever could reach /invoke chose whether irreversible actions were
# permitted, whether the approval gate applied, and which operator to act as --
# so a chatbot driven by a language model was choosing whether to authorise a
# funds transfer. Moving it here is the difference between a wrapper that
# preserves the guardrails and one that routes around them.
#
# A caller sends an operator ALIAS and typed args. Nothing it sends is consulted
# when deciding what it may do.

# Used when a caller names no operator. A teller, deliberately: the least
# privileged identity that can do useful work.
default_operator: teller1

# --- who is signed in ------------------------------------------------------
# The console signs a person in and hands the API a signed session token. The
# API re-resolves that token against the principal store on every call, so the
# ROLE is read here rather than claimed by the request.
#
# Every principal is one of the institution's own operators -- a teller or a
# supervisor. There is no member sign-in: MERIDIAN is a back office, and
# `PrincipalStore.get` refuses any principal whose role is not an operator role.
#
# `require_session: false` keeps the direct agent path (an operator alias in the
# body) working, which is how the CLI demos and any non-browser caller reach the
# API. `python -m bankcua.cli portal` starts the API with --require-session, so
# the browser stack always has a signed-in subject behind every invocation.
require_session: false
principals: config/principals.json
session_key: config/session.key

# --- branches --------------------------------------------------------------
# The branches this deployment recognises. The console offers these at sign-in,
# below the operator, and stamps the chosen one on every run the session
# performs -- it is merged into `branch` server-side, exactly as the operator's
# password is, so a caller can neither choose it per request nor invent one.
#
# Listed here rather than typed at the door because an audit field a caller can
# set to anything is not evidence. The API re-validates the branch a session
# claims against this list on every invocation (`BRANCH_NOT_CONFIGURED`), which
# is what makes it safe for the session token to carry the choice at all.
#
# These are MERIDIAN's OWN branches, and the codes must match the target's
# sign-on dropdown exactly -- `branch` is typed into that form, so a code the
# host does not offer is a run that fails at the first screen. They are
# configuration rather than something this system invents.
#
# Remove the list and the console stops offering a choice: every run then falls
# back to the branch configured on the operator in the credential store, which
# is how this worked before sign-in existed and is what the direct agent path
# still does.
#
# `name` is optional and is only what the console displays; `code` is the value
# sent to the host and recorded on every run.
branches:
  - code: MAIN-001
    name: Main Office
  - code: WEST-014
    name: Westside
  - code: EAST-022
    name: Eastgate

# --- the sign-on, established at the door -----------------------------------
# The capability the CONSOLE runs when a staff member signs in, on the alias
# their sign-in names. Naming it here does two things at once, and they are the
# same decision seen from both sides:
#
#   * it is REMOVED from the manifest and REFUSED at /invoke for any caller
#     carrying a session, because signing on again is either a no-op that drives
#     a live browser for nothing or a way for whoever is in front of the console
#     to exercise an operator credential as an action of its own;
#   * `POST /session/signon` becomes the one path that runs it, and the console
#     calls that path once, at sign-in.
#
# Comment it out and the capability goes back to being an ordinary one -- which
# is what the direct agent path, where nobody signs in, still wants.
session_signon: meridian.signon

# `allowed_principal_roles` is the SIGN-IN half of authorisation and is separate
# from `requires_role`, which is about the Meridian operator a run executes as.
# Both apply, and `meridian.place_hold` below is where the difference shows: it
# demands a supervisor SIGN-IN and a supervisor OPERATOR and a named alias.
#
# The two axes travel together on this deployment, since every principal acts as
# their own alias -- but they are different questions, and collapsing them would
# make the narrower of the two unenforceable the moment they diverged.
#
# An unlisted capability falls back to `auth.DEFAULT_PRINCIPAL_ROLES`, which is
# every configured operator role. Narrow a capability by LISTING it here.

capabilities:
  meridian.signon:
    # Named as `session_signon` above, so these rules are the ones
    # `POST /session/signon` applies at sign-in -- including the approval gate.
    # A deployment that has not approved its sign-on capability signs people in
    # unverified rather than making an exception for the door.
    allowed_principal_roles: [supervisor, teller]
    allow_unapproved: false         # the approval gate applies to reads too

  meridian.member_search:
    # A directory lookup across the membership by surname -- ordinary counter
    # work for either operator.
    allowed_principal_roles: [supervisor, teller]
    allow_unapproved: false

  meridian.member_lookup:
    # Reading a member's record is the core counter task; both operators do it.
    allowed_principal_roles: [supervisor, teller]
    allow_unapproved: false

  meridian.transfer_funds:
    allowed_principal_roles: [supervisor, teller]
    # Moves money, and posting a transfer cannot be undone by replaying it back.
    # Every irreversible step stops for a person: replay raises an intervention
    # at Post Transfer rather than completing unattended. The value policy in
    # config/policy.meridian.yaml still applies on top -- over $1,000 also needs
    # an independent counter-signature, over $5,000 is refused before a browser
    # opens -- but the handoff is the floor, not the ceiling.
    allow_risky: false
    allow_unapproved: false

  meridian.open_share:
    allowed_principal_roles: [supervisor, teller]
    # Opening a share creates an account on the member's record. Irreversible,
    # so it stops for a person rather than completing unattended.
    allow_risky: false
    allow_unapproved: false

  meridian.update_member_info:
    # Contact details, updated at the counter on the member's instruction.
    allowed_principal_roles: [supervisor, teller]
    # Overwriting contact details discards what was there; there is no undo on
    # the host. Irreversible, so it stops for a person.
    allow_risky: false
    allow_unapproved: false

  meridian.place_hold:
    # Supervisors only, on both halves: the sign-in must be a supervisor AND the
    # Meridian operator must hold the supervisor role. This is the capability
    # that makes the two axes above worth keeping separate.
    allowed_principal_roles: [supervisor]
    # The host restricts this to supervisors. We refuse it here as well rather
    # than driving a member's account up to a wall we already know is there --
    # and, more importantly, so the boundary does not depend on the target
    # remembering to enforce it.
    requires_role: supervisor
    allowed_operators: [super1]
    # Like every irreversible action here, not allow_risky: replay escalates and
    # a supervisor completes it on the live session. This one is also the
    # narrowest -- supervisors only, on both halves of the identity.
    allow_risky: false
    allow_unapproved: false
